<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Theft UI</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <div class="header-left">
                    <i class="fas fa-car"></i>
                    <h1>DIN FREMGANG</h1>
                </div>
                <div class="header-right">
                    <div class="level-info">
                        <span class="level-label">MASTER - </span>
                        <span class="level-progress">1540/2000</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress" style="width: 75%;"></div>
                    </div>
                    <div class="refresh-info">
                        <span>Næste refresh om:</span>
                        <span class="refresh-time">05:23 00:01</span>
                    </div>
                </div>
            </div>
            
            <div class="sub-header">
                <div class="vehicle-info-box">
                    <i class="fas fa-warehouse"></i>
                    <span>Biler i Varehus: <span class="vehicle-count">0/10</span></span>
                </div>
                <button id="refresh-button" class="refresh-button">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            
            <div class="tabs">
                <div class="tab active" data-tab="public">
                    <i class="fas fa-globe"></i>
                    <span>Offentlige</span>
                </div>
               
                <div class="tab" data-tab="vehicles">
                    <i class="fas fa-car"></i>
                    <span>Dine køretøjer</span>
                </div>
            </div>
            
            <div class="tab-content active" id="public-content">
                <div class="vehicles-grid">
                    <!-- Vehicle cards will be dynamically inserted here -->
                </div>
            </div>
            
            <div class="tab-content" id="personal-content">
                <div class="vehicles-grid">
                    <!-- Personal vehicles will be dynamically inserted here -->
                </div>
            </div>
            
            <div class="tab-content" id="vehicles-content">
                <div class="vehicles-grid">
                    <!-- User's vehicles will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
